[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refurbpass"
version = "0.2.1"
description = "Outil de diagnostic et certificat de santé pour PC reconditionnés"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "psutil",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
refurbpass = "refurbpass.cli:main"

[tool.setuptools.packages.find]
include = ["refurbpass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
